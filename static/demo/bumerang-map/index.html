  function runBumerangMap(root, __BUMERANG_DATA__) {
  'use strict';

  // === Config ===
  const MIN_ZOOM = 0.8;
  const MAX_ZOOM = 2;
  const ZOOM_STEP = 0.2;
  const ZOOM_WHEEL_FACTOR = 0.001;
  const PAN_INERTIA = 0.92;

  // === State ===
  let storeData = {};
  let currentFloor = 'ground';
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let lastTranslateX = 0;
  let lastTranslateY = 0;
  let velocityX = 0;
  let velocityY = 0;
  let lastMoveX = 0;
  let lastMoveY = 0;
  let animFrame = null;
  let isTouchDevice = false;
  let activeStoreId = null;

  // Pinch state
  let pinchStartDist = 0;
  let pinchStartScale = 1;

  // === DOM References ===
  const wrapper = root.querySelector('.map-wrapper');
  const viewport = root.querySelector('.map-viewport');
  const tooltip = root.querySelector('.map-tooltip');
  const floorLayers = root.querySelectorAll('.floor-layer');
  const floorBtns = root.querySelectorAll('.floor-btn');
  const zoomInBtn = root.querySelector('.zoom-in');
  const zoomOutBtn = root.querySelector('.zoom-out');
  const fitBtn = root.querySelector('.fit-btn');

  // === Init ===
  async function init() {
    await loadStoreData();
    bindFloorSwitching();
    bindZoomControls();
    bindPanZoom();
    bindStoreInteractions();
    fitToView();
  }

  // === Data Loading ===
  async function loadStoreData() {
    storeData = __BUMERANG_DATA__;

    // Synthetic entries for non-store interactive markers
    const elevatorData = {
      name: 'Winda',
      description: '',
      category: '',
      logo: '',
      phone: '',
      email: '',
      hours: {}
    };
    storeData['marker_elevator'] = elevatorData;
    storeData['marker_elevator_g'] = elevatorData;
    storeData['marker_entrance'] = {
      name: 'Wejście główne',
      description: '',
      category: '',
      logo: '',
      phone: '',
      email: '',
      hours: {}
    };
    const wcData = {
      name: 'Toalety',
      description: '',
      category: '',
      logo: '',
      phone: '',
      email: '',
      hours: {}
    };
    storeData['marker_wc'] = wcData;
    storeData['marker_wc_1f'] = wcData;
    storeData['wyj_ew'] = {
      name: 'Wyjście ewakuacyjne',
      description: '',
      category: '',
      logo: '',
      phone: '',
      email: '',
      hours: {}
    };
  }

  // === Floor Switching ===
  function bindFloorSwitching() {
    floorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const floor = btn.dataset.floor;
        switchFloor(floor);
      });
    });
  }

  function switchFloor(floor) {
    if (floor === currentFloor) return;
    currentFloor = floor;

    floorLayers.forEach(layer => {
      layer.classList.toggle('active', layer.dataset.floor === floor);
    });
    floorBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.floor === floor);
    });

    hideTooltip();
    fitToView();
  }

  // === Zoom Controls ===
  function bindZoomControls() {
    zoomInBtn.addEventListener('click', () => {
      zoomTo(scale * (1 + ZOOM_STEP), wrapper.clientWidth / 2, wrapper.clientHeight / 2);
    });
    zoomOutBtn.addEventListener('click', () => {
      zoomTo(scale * (1 - ZOOM_STEP), wrapper.clientWidth / 2, wrapper.clientHeight / 2);
    });
    fitBtn.addEventListener('click', () => fitToView());
  }

  function zoomTo(newScale, cx, cy) {
    newScale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newScale));
    const ratio = newScale / scale;
    translateX = cx - ratio * (cx - translateX);
    translateY = cy - ratio * (cy - translateY);
    scale = newScale;
    applyTransform();
  }

  // === Pan & Zoom (mouse + touch) ===
  function bindPanZoom() {
    // Mouse wheel zoom
    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = -e.deltaY * ZOOM_WHEEL_FACTOR;
      const newScale = scale * (1 + delta);
      const rect = wrapper.getBoundingClientRect();
      zoomTo(newScale, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    // Mouse pan
    wrapper.addEventListener('mousedown', onDragStart);
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragEnd);

    // Touch pan & pinch
    wrapper.addEventListener('touchstart', onTouchStart, { passive: false });
    wrapper.addEventListener('touchmove', onTouchMove, { passive: false });
    wrapper.addEventListener('touchend', onTouchEnd);
  }

  function onDragStart(e) {
    if (e.target.closest('.map-controls') || e.target.closest('.map-tooltip')) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    lastTranslateX = translateX;
    lastTranslateY = translateY;
    lastMoveX = e.clientX;
    lastMoveY = e.clientY;
    velocityX = 0;
    velocityY = 0;
    wrapper.classList.add('grabbing');
    cancelInertia();
  }

  function onDragMove(e) {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    translateX = lastTranslateX + dx;
    translateY = lastTranslateY + dy;

    velocityX = e.clientX - lastMoveX;
    velocityY = e.clientY - lastMoveY;
    lastMoveX = e.clientX;
    lastMoveY = e.clientY;

    applyTransform();
  }

  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    wrapper.classList.remove('grabbing');
    startInertia();
  }

  // Touch handlers
  function onTouchStart(e) {
    isTouchDevice = true;
    if (e.touches.length === 1) {
      if (e.target.closest('.map-controls') || e.target.closest('.map-tooltip')) return;
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      lastTranslateX = translateX;
      lastTranslateY = translateY;
      velocityX = 0;
      velocityY = 0;
      cancelInertia();
    } else if (e.touches.length === 2) {
      e.preventDefault();
      isDragging = false;
      pinchStartDist = getTouchDist(e.touches);
      pinchStartScale = scale;
    }
  }

  function onTouchMove(e) {
    if (e.touches.length === 1 && isDragging) {
      e.preventDefault();
      const dx = e.touches[0].clientX - dragStartX;
      const dy = e.touches[0].clientY - dragStartY;
      translateX = lastTranslateX + dx;
      translateY = lastTranslateY + dy;
      applyTransform();
    } else if (e.touches.length === 2) {
      e.preventDefault();
      const dist = getTouchDist(e.touches);
      const newScale = pinchStartScale * (dist / pinchStartDist);
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = wrapper.getBoundingClientRect();
      zoomTo(newScale, cx - rect.left, cy - rect.top);
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length === 0) {
      isDragging = false;
    }
  }

  function getTouchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Inertia
  function startInertia() {
    if (Math.abs(velocityX) < 0.5 && Math.abs(velocityY) < 0.5) return;
    function step() {
      velocityX *= PAN_INERTIA;
      velocityY *= PAN_INERTIA;
      if (Math.abs(velocityX) < 0.1 && Math.abs(velocityY) < 0.1) return;
      translateX += velocityX;
      translateY += velocityY;
      applyTransform();
      animFrame = requestAnimationFrame(step);
    }
    animFrame = requestAnimationFrame(step);
  }

  function cancelInertia() {
    if (animFrame) {
      cancelAnimationFrame(animFrame);
      animFrame = null;
    }
  }

  // === Transform ===
  function applyTransform() {
    viewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }

  // === Fit to View ===
  function fitToView() {
    const activeLayer = root.querySelector(`.floor-layer[data-floor="${currentFloor}"]`);
    const svg = activeLayer.querySelector('svg');
    if (!svg) return;

    const svgW = parseFloat(svg.getAttribute('width'));
    const svgH = parseFloat(svg.getAttribute('height'));
    const wrapperW = wrapper.clientWidth;
    const wrapperH = wrapper.clientHeight;

    const padding = 40;
    const scaleX = (wrapperW - padding * 2) / svgW;
    const scaleY = (wrapperH - padding * 2) / svgH;
    scale = Math.min(scaleX, scaleY);

    translateX = (wrapperW - svgW * scale) / 2;
    translateY = (wrapperH - svgH * scale) / 2;

    applyTransform();
  }

  // === Store Interactions ===
  function bindStoreInteractions() {
    const storePaths = root.querySelectorAll('path[id^="store"], g[id^="marker"], path#wyj_ew');

    // Group locals that belong to the same tenant (identical name) so that
    // hovering/tapping any one of them highlights the whole tenant at once
    // (e.g. Klim Szkoła Językowa occupies several lots on the first floor).
    const tenantGroups = {};
    Object.keys(storeData).forEach(id => {
      const d = storeData[id];
      if (!d || !d.name) return;
      (tenantGroups[d.name] = tenantGroups[d.name] || []).push(id);
    });

    function groupMembers(id) {
      const d = storeData[id];
      const group = d && d.name ? tenantGroups[d.name] : null;
      return group && group.length > 1 ? group : [id];
    }

    function setGroupActive(id, on) {
      groupMembers(id).forEach(mid => {
        const el = root.getElementById(mid);
        if (el) el.classList.toggle('active', on);
      });
    }

    storePaths.forEach(path => {
      const data = storeData[path.id];
      if (!data || !data.name) {
        path.classList.add('empty-store');
        return;
      }

      // Desktop hover
      path.addEventListener('mouseenter', (e) => {
        if (isTouchDevice) return;
        showTooltip(path.id, e.clientX, e.clientY);
        setGroupActive(path.id, true);
      });

      path.addEventListener('mousemove', (e) => {
        if (isTouchDevice) return;
        positionTooltip(e.clientX, e.clientY);
      });

      path.addEventListener('mouseleave', () => {
        if (isTouchDevice) return;
        hideTooltip();
        setGroupActive(path.id, false);
      });

      // Mobile tap
      path.addEventListener('click', (e) => {
        if (!isTouchDevice) return;
        e.stopPropagation();

        // Deactivate previous
        if (activeStoreId && activeStoreId !== path.id) {
          setGroupActive(activeStoreId, false);
        }

        if (activeStoreId === path.id) {
          hideTooltip();
          setGroupActive(path.id, false);
          activeStoreId = null;
        } else {
          activeStoreId = path.id;
          setGroupActive(path.id, true);
          // Position tooltip at center of store bbox
          const rect = path.getBoundingClientRect();
          showTooltip(path.id, rect.left + rect.width / 2, rect.top);
        }
      });
    });

    // Tap outside on mobile to dismiss
    wrapper.addEventListener('click', (e) => {
      if (!isTouchDevice) return;
      if (!e.target.closest('path[id^="store"], g[id^="marker"], path#wyj_ew')) {
        hideTooltip();
        if (activeStoreId) {
          setGroupActive(activeStoreId, false);
          activeStoreId = null;
        }
      }
    });
  }

  // === Tooltip ===
  function showTooltip(storeId, x, y) {
    const data = storeData[storeId];
    if (!data) return;

    const header = tooltip.querySelector('.tooltip-header');
    const nameEl = tooltip.querySelector('.tooltip-name');
    const catEl = tooltip.querySelector('.tooltip-category');
    const descEl = tooltip.querySelector('.tooltip-description');
    const contactEl = tooltip.querySelector('.tooltip-contact');
    const hoursEl = tooltip.querySelector('.tooltip-hours');

    const displayName = data.name || 'Lokal';

    // Logo
    const existingLogo = header.querySelector('.tooltip-logo, .tooltip-logo-placeholder');
    if (existingLogo) existingLogo.remove();

    if (data.logo) {
      const img = document.createElement('img');
      img.className = 'tooltip-logo';
      img.src = data.logo;
      img.alt = displayName;
      header.insertBefore(img, header.firstChild);
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'tooltip-logo-placeholder';
      placeholder.textContent = displayName.charAt(0).toUpperCase();
      header.insertBefore(placeholder, header.firstChild);
    }

    nameEl.textContent = displayName;
    catEl.textContent = data.category || '';
    catEl.style.display = data.category ? 'block' : 'none';
    descEl.textContent = data.description || '';
    descEl.style.display = data.description ? 'block' : 'none';

    // Contact (phone + email)
    contactEl.innerHTML = '';
    const hasPhone = !!data.phone;
    const hasEmail = !!data.email;
    if (hasPhone) {
      const row = document.createElement('div');
      row.className = 'tooltip-contact-row';
      row.innerHTML = `<span class="tooltip-contact-icon">☎</span><span>${escapeHtml(data.phone)}</span>`;
      contactEl.appendChild(row);
    }
    if (hasEmail) {
      const row = document.createElement('div');
      row.className = 'tooltip-contact-row';
      row.innerHTML = `<span class="tooltip-contact-icon">✉</span><span>${escapeHtml(data.email)}</span>`;
      contactEl.appendChild(row);
    }
    contactEl.style.display = (hasPhone || hasEmail) ? 'block' : 'none';

    // Hours
    hoursEl.innerHTML = '';
    const hours = data.hours && typeof data.hours === 'object' ? data.hours : null;
    const hourEntries = hours ? Object.entries(hours) : [];
    if (hourEntries.length) {
      const title = document.createElement('div');
      title.className = 'tooltip-hours-title';
      title.textContent = 'Godziny otwarcia';
      hoursEl.appendChild(title);
      hourEntries.forEach(([days, time]) => {
        const row = document.createElement('div');
        row.className = 'tooltip-hours-row';
        row.innerHTML = `<span class="tooltip-hours-days">${escapeHtml(days)}</span><span class="tooltip-hours-time">${escapeHtml(time)}</span>`;
        hoursEl.appendChild(row);
      });
      hoursEl.style.display = 'block';
    } else {
      hoursEl.style.display = 'none';
    }

    tooltip.classList.add('visible');
    positionTooltip(x, y);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function positionTooltip(x, y) {
    const pad = 16;
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    const ww = window.innerWidth;
    const wh = window.innerHeight;

    let left = x + pad;
    let top = y - th / 2;

    // Flip horizontally if too close to right edge
    if (left + tw > ww - pad) {
      left = x - tw - pad;
    }
    // Clamp vertically
    if (top < pad) top = pad;
    if (top + th > wh - pad) top = wh - th - pad;

    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
  }

  // === Window resize ===
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => fitToView(), 150);
  });

  // === Start ===
  init();
}

  runBumerangMap(root, __BUMERANG_DATA__);
})();
</script>
